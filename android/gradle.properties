# Project-wide Gradle settings.
# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE are ignored when building from the command line, check
# the corresponding build.gradle files instead.

# For more details on how to configure your build environment visit
# http://www.gradle.org/configure-gradle-for-performance

# Specifies the JVM arguments used for the daemon process.
# The setting is particularly useful for headless machines. See also http://gradle.org/daemon
# org.gradle.jvmargs=-Xmx1536m

# When configured, Gradle will run in incubating parallel mode.
# This option should only be used with decoupled projects. See also:
# http://www.gradle.org/configure-gradle-for-performance#parallel_builds
# org.gradle.parallel=true

# AndroidX package structure to make it clearer which packages are being used
android.useAndroidX=true

# Enables namespacing of each library's R class so that its R class includes only the
# resources declared in the library itself and does not include resources from its dependencies,
# thereby reducing the size of the library's R class.
android.nonTransitiveRClass=true

# Kotlin
kotlin.code.style=official

# Usa o JDK 21 para o build, pois o JDK 26 (padrão do JAVA_HOME) ainda não é
# suportado pelo Gradle 8.13 / Kotlin 1.9.22 usados neste projeto.
org.gradle.java.home=C:\\Program Files\\Java\\jdk-21.0.4+7
